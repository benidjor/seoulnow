name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python:
    name: Python lint + unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.x"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dev + flink deps
        run: uv sync --extra dev --extra flink

      - name: Ruff lint
        run: uv run ruff check src tests

      - name: Pytest unit
        run: uv run pytest tests/unit -v

  dbt:
    name: dbt parse + compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.x"

      - name: Set up Python
        run: uv python install 3.11

      # PyFlink 1.20 transitive apache-beam 의 protobuf 와 dbt-core 의 protobuf
      # 가 양립 불가 → flink 와 dbt extras 가 conflicts (pyproject.toml).
      # CI 도 job 별로 분리해 dbt job 은 dbt extra 만.
      - name: Install dbt deps (separate from flink)
        run: uv sync --extra dbt

      - name: Write CI profiles.yml (in-memory DuckDB, MinIO 미사용)
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          seoul_duckdb:
            target: ci
            outputs:
              ci:
                type: duckdb
                path: ":memory:"
          EOF

      # CI 환경엔 MinIO 가 없어 `dbt run` / `dbt test` 는 빠짐.
      # parse + compile 까지 (model SQL/Jinja 렌더링 검증).
      - name: dbt deps
        working-directory: dbt/seoul
        run: uv run --project ../.. --extra dbt dbt deps

      - name: dbt parse
        working-directory: dbt/seoul
        run: uv run --project ../.. --extra dbt dbt parse

      - name: dbt compile
        working-directory: dbt/seoul
        run: uv run --project ../.. --extra dbt dbt compile

  # 문서 서식 · 계획서 절 · PR 규약 검사 (2026-10-21 bullet-in 에서 이식).
  # 정본 = docs/conventions/2026-10-21-commit-pr-convention.md §2.2 · docs/conventions/2026-10-21-review-instructions.md §5
  docs-format:
    name: 문서 서식
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 바뀐 파일만 보고, 2026-10-21 이전부터 있던 문서는 훅이 건너뛴다 (DOC_FORMAT_BASE = PR 의 base).
      - name: 바뀐 docs/*.md 서식 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOC_FORMAT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          fail=0
          for f in $(git diff --name-only --diff-filter=d "$BASE_SHA" HEAD -- 'docs/**/*.md'); do
            if ! printf '{"tool_input":{"file_path":"%s"}}' "$PWD/$f" \
                 | python3 .claude/hooks/check-doc-format.py; then
              echo "::error file=$f::문서 서식 위반 (컨벤션 §2.2)"
              fail=1
            fi
          done
          exit $fail

      # 훅은 Write · Edit 만 본다 — Bash 로 쓴 문서 · 날짜를 뺀 새 계획서 · 스펙은 여기서 잡는다.
      - name: 바뀐 계획서 · 스펙의 가정과 확인 절 검사
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 .claude/hooks/check-plan-sections.py --changed "$BASE_SHA" \
            || { echo "::error::계획서 · 스펙 절 누락 (docs/conventions/2026-10-21-review-instructions.md §5)"; exit 1; }

  pr-format:
    name: PR 규약
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 제목은 squash merge 로 커밋 제목이 되고 머지 뒤에는 못 고친다 — 그래서 차단한다.
      - name: 제목 (차단)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .claude/tools/check-pr-format.py --title "$PR_TITLE"

      # 본문은 알림만 한다 — 차단하면 정상 PR 의 빨간불이 잦아져 무시된다.
      - name: 본문 (알림만)
        if: always()
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > pr_body.md
          {
            echo "## PR 본문 규약 (알림만 · 차단 안 함)"
            echo
            echo '```'
            python3 .claude/tools/check-pr-format.py --body pr_body.md || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
